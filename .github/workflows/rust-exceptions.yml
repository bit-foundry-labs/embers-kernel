name: Embers M03 exception traps in QEMU

on:
  push:
    paths:
      - "rust-kernel/**"
      - "tools/embers-validation/**"
      - "Makefile"
      - "linker.ld"
      - "scripts/make_iso.sh"
      - "scripts/check_rust_elf.py"
      - "scripts/check_permission_fault.py"
      - ".github/workflows/rust-exceptions.yml"
  # Required checks must run even for documentation-only pull requests.
  pull_request:

permissions:
  contents: read

jobs:
  exceptions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rust formatting and lints
        working-directory: rust-kernel
        run: |
          cargo fmt --all -- --check
          cargo clippy --release --offline -- -D warnings
          for mode in ud pf df ro-write nx-exec; do
            cargo clippy --release --offline --features "fault-$mode" -- -D warnings
          done
      - name: Reject conflicting QEMU fault-injection features
        shell: bash
        working-directory: rust-kernel
        run: |
          set -euo pipefail
          mkdir -p ../build/exception-logs
          for features in "fault-ud,fault-pf" "fault-ud,fault-df" "fault-pf,fault-df" "fault-ud,fault-pf,fault-df"; do
            log="../build/exception-logs/conflicting-${features//,/-}.log"
            if cargo check --release --offline --features "$features" >"$log" 2>&1; then
              echo "Expected a compile-time rejection for $features" >&2
              exit 1
            fi
            if ! grep -Fq "QEMU fault-injection features are mutually exclusive: choose only one of fault-ud, fault-pf, or fault-df." "$log"; then
              echo "Compilation failed for an unexpected reason: $features" >&2
              cat "$log" >&2
              exit 1
            fi
            echo "PASS: conflicting fault modes rejected: $features"
          done
          for features in "fault-ro-write,fault-nx-exec" "fault-ro-write,fault-pf" "fault-nx-exec,fault-df"; do
            log="../build/exception-logs/conflicting-${features//,/-}.log"
            if cargo check --release --offline --features "$features" >"$log" 2>&1; then
              echo "Unexpected success for conflicting $features" >&2
              exit 1
            fi
            grep -Fq "QEMU permission fault tests are mutually exclusive with other fault modes." "$log"
          done
          for features in "transition-stack-smoke,fault-ro-write" "transition-stack-smoke,fault-nx-exec"; do
            log="../build/exception-logs/conflicting-${features//,/-}.log"
            if cargo check --release --offline --features "$features" >"$log" 2>&1; then
              echo "Unexpected success for stack and fault mode $features" >&2
              exit 1
            fi
            grep -Fq "transition-stack-smoke cannot be combined with fault injection modes." "$log"
          done
      - name: Validate permission-fault diagnostic parser on host
        run: python3 scripts/check_permission_fault.py --self-test
      - name: Validate isolated APT mirror fallback and security preservation
        run: python3 scripts/qemu_mirror_fallback.py --self-test
      - name: Provision QEMU and ISO tools with mirror fallback
        shell: bash
        run: bash scripts/install_qemu_ci.sh
      - name: Boot normal kernel and inject intentional CPU faults
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/exception-logs
          for mode in normal ud pf df ro-write nx-exec; do
            if [[ "$mode" == "normal" ]]; then
              make rust-iso
              expected="READY: Embers Rust no_std entry reached."
            else
              make rust-iso RUST_FEATURES="--features fault-$mode"
              case "$mode" in
                ud) expected="FAULT: #UD invalid opcode" ;;
                pf) expected="FAULT: #PF page fault" ;;
                df) expected="FAULT: #DF double fault" ;;
                ro-write | nx-exec) expected="FAULT: #PF page fault" ;;
              esac
            fi

            # Check the exact ELF from each normal or fault-injection build.
            cargo +1.90.0 run --offline --manifest-path tools/embers-validation/Cargo.toml -- \
              rust-kernel/target/x86_64-unknown-none/release/embers-rust-kernel

            # Preserve the existing required M03 job and legacy max logs.
            # Only permission tests repeat in qemu64; same feature ISO.
            cpu_models=(max)
            if [[ "$mode" == "ro-write" || "$mode" == "nx-exec" ]]; then
              cpu_models=(max qemu64)
            fi
            for cpu_model in "${cpu_models[@]}"; do
              suffix=""
              if [[ "$cpu_model" != "max" ]]; then
                suffix=".$cpu_model"
              fi
              serial_log="build/exception-logs/$mode$suffix.serial.log"
              trace_log="build/exception-logs/$mode$suffix.qemu.log"
              echo "--- $mode: Boot x86-64 QEMU cpu=$cpu_model ---"
              set +e
              timeout --signal=TERM --kill-after=2s 10s \
                qemu-system-x86_64 -cpu "$cpu_model" -m 256M \
                  -cdrom build/embers-rust.iso -display none \
                  -serial "file:$serial_log" \
                  -d int,guest_errors -D "$trace_log" \
                  -monitor none -no-reboot -no-shutdown
              status=$?
              set -e
              echo "QEMU cpu=$cpu_model exit: $status"
              cat "$serial_log" || true
              if [[ "$status" -ne 124 && "$status" -ne 0 ]]; then
                echo "QEMU $cpu_model returned unexpected status in $mode" >&2
                exit 1
              fi
              grep -Fq "$expected" "$serial_log"
              if grep -Fq "ERROR:" "$serial_log"; then
                echo "Kernel emitted ERROR during $mode on $cpu_model" >&2
                exit 1
              fi
              if [[ "$mode" != "normal" ]]; then
                if grep -Fq "READY: Embers" "$serial_log"; then
                  echo "Fault scenario reached READY on $cpu_model" >&2
                  exit 1
                fi
                grep -Eq 'RIP=0x[[:xdigit:]]{16}' "$serial_log"
                if [[ "$mode" == "ro-write" || "$mode" == "nx-exec" ]]; then
                  grep -Fq "PAGING: CPU protection controls active (CR0.WP, EFER.NXE, EFER.LMA)" "$serial_log"
                  python3 scripts/check_permission_fault.py \
                    --mode "$mode" \
                    --elf rust-kernel/target/x86_64-unknown-none/release/embers-rust-kernel \
                    "$serial_log"
                  echo "PASS: $cpu_model effective permission rejection in $mode"
                fi
              fi
            done
          done
      - name: Upload complete fault and exception evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embers-m03-exception-logs
          path: build/exception-logs/
          if-no-files-found: ignore
