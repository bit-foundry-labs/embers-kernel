name: Embers Rust no_std QEMU boot

on:
  push:
    paths:
      - "rust-kernel/**"
      - "linker.ld"
      - "scripts/make_iso.sh"
      - "scripts/check_rust_elf.py"
      - "Makefile"
      - ".github/workflows/rust-boot.yml"
  # Required checks must run even for documentation-only pull requests.
  pull_request:

permissions:
  contents: read

jobs:
  boot-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile_name: control-max
            cpu_model: max
          - profile_name: baseline-qemu64
            cpu_model: qemu64
    steps:
      - uses: actions/checkout@v4
      - name: Confirm pinned Rust toolchain
        working-directory: rust-kernel
        run: |
          rustc --version
          cargo --version
      - name: Check Rust formatting and Clippy
        working-directory: rust-kernel
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2021 --check research/cr3_transition_gate.rs
          cargo clippy --release --offline -- -D warnings
      - name: Test serial diagnostic failure paths on host
        run: make rust-serial-test
      - name: Test paging mode validator on host
        run: make rust-paging-mode-test
      - name: Test fail-closed transition gate on host
        run: make rust-transition-gate-test
      - name: Install emulator and ISO tools
        shell: bash
        run: |
          set -euo pipefail
          # Avoid a ten-minute hang when Ubuntu package mirrors are unreachable.
          timeout 60s sudo apt-get update -o Acquire::Retries=0 -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12
          timeout 90s sudo apt-get install -y -o Acquire::Retries=0 -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 qemu-system-x86 xorriso
          command -v qemu-system-x86_64
          command -v xorriso
      - name: Build and inspect ELF then ISO
        run: make rust-iso
      - name: Boot QEMU and verify Rust READY
        shell: bash
        run: |
          set +e
          echo "QEMU CPU model: ${{ matrix.cpu_model }}"
          timeout --signal=TERM --kill-after=2s 20s \
            qemu-system-x86_64 -cpu "${{ matrix.cpu_model }}" -m 256M \
              -cdrom build/embers-rust.iso -display none \
              -d int,guest_errors -D "build/embers-rust-debug-${{ matrix.profile_name }}.log" \
              -serial "file:build/embers-rust-serial-${{ matrix.profile_name }}.log" \
              -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          echo "QEMU exit status: $status"
          if [[ -f "build/embers-rust-serial-${{ matrix.profile_name }}.log" ]]; then
            cat "build/embers-rust-serial-${{ matrix.profile_name }}.log"
          fi
          if [[ "$status" -ne 124 && "$status" -ne 0 ]]; then
            echo "QEMU execution failed" >&2
            exit 1
          fi
          if grep -Fq "ERROR:" "build/embers-rust-serial-${{ matrix.profile_name }}.log"; then
            echo "Rust kernel reported error" >&2
            exit 1
          fi
          grep -Fq "READY: Embers Rust no_std entry reached." "build/embers-rust-serial-${{ matrix.profile_name }}.log"
          grep -Fq "ADDRESS: Limine HHDM and executable bases validated" "build/embers-rust-serial-${{ matrix.profile_name }}.log"
          grep -Fq "PAGING: active four-level mode validated" "build/embers-rust-serial-${{ matrix.profile_name }}.log"
          if grep -Fq "OWNERSHIP:" "build/embers-rust-serial-${{ matrix.profile_name }}.log"; then
            echo "Normal boot unexpectedly ran the optional ownership smoke test" >&2
            exit 1
          fi
      - name: Preserve serial and exception logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embers-rust-boot-logs-${{ matrix.profile_name }}
          path: |
            build/embers-rust-serial-${{ matrix.profile_name }}.log
            build/embers-rust-debug-${{ matrix.profile_name }}.log
          if-no-files-found: ignore

  # Preserve the required status name while requiring every matrix lane.
  rust-boot:
    needs: boot-matrix
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all QEMU profiles to pass
        env:
          MATRIX_RESULT: ${{ needs.boot-matrix.result }}
        run: test "$MATRIX_RESULT" = success
