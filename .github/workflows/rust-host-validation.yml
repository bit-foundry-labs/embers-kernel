name: Rust host validation pilot

on:
  pull_request:
    paths:
      - "tools/embers-validation/**"
      - ".github/workflows/rust-host-validation.yml"
  push:
    paths:
      - "tools/embers-validation/**"
      - ".github/workflows/rust-host-validation.yml"

permissions:
  contents: read

jobs:
  host-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/embers-validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.90.0 fmt --all -- --check
      - run: cargo +1.90.0 test --offline
      - run: cargo +1.90.0 clippy --offline --all-targets -- -D warnings
