name: Embers M04 physical memory map and frame ledger

on:
  push:
    paths:
      - "rust-kernel/**"
      - "Makefile"
      - ".github/workflows/rust-memory.yml"
  # Required checks must run even for documentation-only pull requests.
  pull_request:

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Format and lint Rust kernel
        working-directory: rust-kernel
        run: |
          cargo fmt --all -- --check
          cargo clippy --release --offline -- -D warnings
          cargo clippy --release --offline --features boot-ownership-smoke -- -D warnings
      - name: Test M04 map and M05 ownership invariants on host
        run: |
          make rust-memory-test
          make rust-ledger-test
          make rust-provenance-test
          make rust-boot-pool-gate-test
          make rust-frame-registry-test
          (cd rust-kernel && rustfmt --edition 2021 --check research/page_entry.rs research/page_walk.rs tests/page_research_integration.rs)
          (cd rust-kernel && clippy-driver --edition=2021 --test research/page_entry.rs -D warnings -o /tmp/embers-entry-clippy)
          (cd rust-kernel && clippy-driver --edition=2021 --test research/page_walk.rs -D warnings -o /tmp/embers-walk-clippy)
          make rust-paging-research-test
      - name: Install QEMU and ISO prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # Avoid a ten-minute hang when Ubuntu package mirrors are unreachable.
          timeout 60s sudo apt-get update -o Acquire::Retries=0 -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12
          timeout 90s sudo apt-get install -y -o Acquire::Retries=0 -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 qemu-system-x86 xorriso
          command -v qemu-system-x86_64
          command -v xorriso
      - name: Build freestanding Rust ELF and Limine ISO
        run: make rust-iso RUST_FEATURES="--features boot-ownership-smoke"
      - name: Boot and check M04 frame claims plus M05 owner quarantine
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=2s 12s \
            qemu-system-x86_64 -cpu max -m 256M \
              -cdrom build/embers-rust.iso -display none \
              -d int,guest_errors -D build/m04-qemu.log \
              -serial file:build/m04-serial.log \
              -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          echo "QEMU status: $status"
          cat build/m04-serial.log
          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          serial = Path("build/m04-serial.log").read_text()
          assert "ERROR:" not in serial
          assert "MEMORY: validated Limine map for physical frame accounting" in serial
          assert "ADDRESS: Limine HHDM and executable bases validated" in serial
          for field in ("HHDM offset", "executable physical base", "executable virtual base"):
              assert re.search(rf"ADDRESS: {field} = 0x[0-9a-f]{{16}}", serial), field
          assert "MEMORY: boot reservation retained after initialization" in serial
          assert "READY: Embers Rust no_std entry reached." in serial
          values = re.findall(
              r"MEMORY: frame claim [12] = 0x([0-9a-f]{16})", serial
          )
          assert len(values) == 2, f"expected two frame addresses, got {values!r}"
          first, second = (int(value, 16) for value in values)
          assert first >= 0x100000 and first % 4096 == 0
          assert second == first + 4096, "claims must be unique and consecutive"
          print("PASS: two unique, page-aligned, consecutive physical ledger claims")
          assert "OWNERSHIP: cross-owner access rejected" in serial
          assert "OWNERSHIP: quarantined frame blocked from reuse" in serial
          match = re.search(r"OWNERSHIP: owner 2 frame = 0x([0-9a-f]{16})", serial)
          assert match, "missing M05 assigned frame address"
          owner2_frame = int(match.group(1), 16)
          assert owner2_frame == second + 2 * 4096, (
              "owner 2 must receive a distinct aligned frame from M05 ledger"
          )
          print("PASS: M05 unique ownership, cross-owner denial and permanent quarantine")
          PY
      - name: Preserve boot and exception evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embers-m04-memory-logs
          path: |
            build/m04-serial.log
            build/m04-qemu.log
          if-no-files-found: ignore
